name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment tag
        id: set-tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then echo "tag=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "qa" ]; then echo "tag=qa" >> $GITHUB_OUTPUT
          else echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clusterguard:${{ steps.set-tag.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
            kubectl apply --validate=false -k k8s/overlays/${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
            kubectl rollout restart deployment/${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-smart-log-analyzer -n ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}